    <!-- ऑनलाइन सदस्यता फॉर्म सेक्शन -->
    <section id="join" style="padding: 20px; max-width: 500px; margin: 40px auto; background: #f9f9f9; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); font-family: sans-serif;">
        <h2 style="text-align: center; color: #333; margin-bottom: 5px;">オンライン सदस्यता फॉर्म</h2>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">पार्टी से जुड़ने के लिए कृपया नीचे दी गई जानकारी भरें:</p>
        
        <!-- नया और सुरक्षित सबमिशन लिंक -->
        <form action="https://web3forms.com" method="POST">
            
            <!-- आपकी ईमेल पर डेटा भेजने के लिए यह की (Access Key) है -->
            <input type="hidden" name="access_key" value="7e74d445-6677-4402-990e-b98cc6c86ae9">

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">पूरा नाम *</label>
                <input type="text" name="नाम" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">मोबाइल नंबर *</label>
                <input type="tel" name="मोबाइल_नंबर" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">ईमेल आईडी</label>
                <input type="email" name="ईमेल" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">राज्य और जिला *</label>
                <input type="text" name="स्थान" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" placeholder="उदा. उत्तर प्रदेश, लखनऊ">
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">सदस्यता सबमिट करें</button>
        </form>
    </section>
